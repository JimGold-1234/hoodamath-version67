
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iCom | Communication</title>

<style>
:root {
  --bg: #0b1020;
  --panel: #121b2e;
  --panel2: #18243a;
  --border: #263650;
  --text: #f2f5fa;
  --muted: #9aabc2;
  --blue: #4385ff;
  --blue2: #2866db;
  --green: #48d6a0;
  --red: #ff6666;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

#authScreen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.auth-card {
  background: var(--panel);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 420px;
  padding: 32px;
  border-radius: 18px;
}

.logo {
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -2px;
  margin-bottom: 5px;
}

.logo span {
  color: var(--blue);
}

.subtitle {
  color: var(--muted);
  margin-bottom: 28px;
}

input {
  width: 100%;
  padding: 13px;
  background: #0c1526;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: white;
  outline: none;
  margin-bottom: 12px;
}

input:focus {
  border-color: var(--blue);
}

.primary-btn {
  width: 100%;
  border: none;
  border-radius: 9px;
  padding: 13px;
  background: var(--blue);
  color: white;
  font-weight: bold;
}

.primary-btn:hover {
  background: var(--blue2);
}

.secondary-btn {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: white;
  border-radius: 8px;
  padding: 10px 13px;
}

.link-btn {
  border: none;
  background: none;
  color: #78a8ff;
  margin-top: 17px;
  width: 100%;
}

.error {
  color: var(--red);
  font-size: 13px;
  margin-bottom: 12px;
}

#app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  width: 320px;
  min-width: 280px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header .logo {
  font-size: 29px;
}

.sidebar-section {
  padding: 15px 16px 5px;
  color: var(--muted);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
}

#conversationList,
#userList {
  padding: 5px 10px;
}

.sidebar-scroll {
  overflow-y: auto;
  flex: 1;
}

.list-item {
  width: 100%;
  border: none;
  background: transparent;
  color: white;
  padding: 12px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 11px;
  text-align: left;
  margin-bottom: 3px;
}

.list-item:hover,
.list-item.active {
  background: var(--panel2);
}

.avatar {
  width: 39px;
  height: 39px;
  flex-shrink: 0;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #244578;
  color: #c6dcff;
  font-weight: bold;
}

.item-details {
  min-width: 0;
  flex: 1;
}

.item-name {
  display: block;
  font-size: 14px;
  font-weight: bold;
}

.item-subtitle {
  display: block;
  color: var(--muted);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 4px;
}

.sidebar-bottom {
  padding: 15px;
  border-top: 1px solid var(--border);
}

.profile-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.profile-info {
  min-width: 0;
  flex: 1;
}

.profile-info strong {
  display: block;
  font-size: 14px;
}

.profile-info small {
  color: var(--muted);
  overflow-wrap: anywhere;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.welcome {
  margin: auto;
  text-align: center;
  padding: 30px;
}

.welcome h1 {
  font-size: 36px;
}

.welcome p {
  color: var(--muted);
}

.chat-header {
  padding: 17px 22px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 75px;
}

.chat-header-info {
  flex: 1;
}

.chat-header-info strong {
  display: block;
}

.chat-header-info small {
  color: var(--muted);
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: min(75%, 550px);
  display: flex;
  flex-direction: column;
  align-self: flex-start;
}

.message.mine {
  align-self: flex-end;
}

.message-author {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
}

.message-bubble {
  background: var(--panel2);
  padding: 11px 14px;
  border-radius: 12px;
  overflow-wrap: anywhere;
  line-height: 1.45;
  white-space: pre-wrap;
}

.message.mine .message-bubble {
  background: var(--blue2);
}

.message-time {
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
}

.message-form {
  padding: 15px 20px;
  display: flex;
  gap: 10px;
  background: var(--panel);
  border-top: 1px solid var(--border);
}

.message-form input {
  margin: 0;
  flex: 1;
}

.message-form button {
  width: auto;
  padding: 0 22px;
}

.chat-empty {
  color: var(--muted);
  margin: auto;
  text-align: center;
}

.status {
  color: var(--green);
  font-size: 12px;
  margin-top: 10px;
}

#mobileBack {
  display: none;
}

@media(max-width:700px) {
  .sidebar {
    width: 100%;
    min-width: 0;
  }

  .main {
    width: 100%;
  }

  #app.show-chat .sidebar {
    display: none;
  }

  #app:not(.show-chat) .main {
    display: none;
  }

  #mobileBack {
    display: block;
  }

  .auth-card {
    padding: 24px;
  }
}
</style>
</head>

<body>

<!-- LOGIN AND REGISTRATION -->

<section id="authScreen">
  <div class="auth-card">

    <div class="logo">i<span>Com</span></div>
    <div class="subtitle">Your conversations, all in one place.</div>

    <div id="loginForm">
      <h2>Welcome back</h2>
      <p style="color:var(--muted)">Sign in to your account.</p>

      <input id="loginEmail" type="email" placeholder="Email address" autocomplete="email">
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">

      <div id="loginError" class="error"></div>

      <button class="primary-btn" id="loginButton">Sign In</button>

      <button class="link-btn" id="forgotPassword">Forgot your password?</button>

      <button class="link-btn" id="showRegister">
        Don't have an account? Create one
      </button>
    </div>

    <div id="registerForm" class="hidden">
      <h2>Create an account</h2>
      <p style="color:var(--muted)">Join iCom today.</p>

      <input id="registerUsername" type="text" placeholder="Username" maxlength="24" autocomplete="username">
      <input id="registerEmail" type="email" placeholder="Email address" autocomplete="email">
      <input id="registerPassword" type="password" placeholder="Password (at least 8 characters)" autocomplete="new-password">

      <div id="registerError" class="error"></div>

      <button class="primary-btn" id="registerButton">Create Account</button>

      <button class="link-btn" id="showLogin">
        Already have an account? Sign in
      </button>
    </div>

  </div>
</section>


<!-- MAIN APPLICATION -->

<div id="app" class="hidden">

  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="logo">i<span>Com</span></div>
      <div class="subtitle" style="margin:0">Communication made simple.</div>
    </div>

    <div style="padding:13px 14px 0">
      <input id="searchUsers" type="search" placeholder="Search people...">
    </div>

    <div class="sidebar-scroll">

      <div class="sidebar-section">Conversations</div>
      <div id="conversationList"></div>

      <div class="sidebar-section">People</div>
      <div id="userList"></div>

    </div>

    <div class="sidebar-bottom">
      <div class="profile-row">
        <div class="avatar" id="myAvatar">?</div>

        <div class="profile-info">
          <strong id="myUsername">Loading...</strong>
          <small id="myEmail"></small>
        </div>

        <button class="secondary-btn" id="signOutButton">Exit</button>
      </div>
    </div>

  </aside>

  <main class="main">

    <div id="welcomeScreen" class="welcome">
      <div class="logo">i<span>Com</span></div>
      <h1>Welcome to iCom</h1>
      <p>Select a person or conversation to get started.</p>
    </div>

    <section id="chatScreen" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">

      <header class="chat-header">
        <button id="mobileBack" class="secondary-btn">Back</button>
        <div class="avatar" id="chatAvatar">?</div>

        <div class="chat-header-info">
          <strong id="chatTitle">Conversation</strong>
          <small id="chatSubtitle"></small>
        </div>
      </header>

      <div id="messages">
        <div class="chat-empty">Loading messages...</div>
      </div>

      <form id="messageForm" class="message-form">
        <input id="messageInput" maxlength="2000" placeholder="Write a message..." autocomplete="off" required>
        <button class="primary-btn" type="submit">Send</button>
      </form>

    </section>

  </main>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  addDoc,
  updateDoc,
  collection,
  query,
  where,
  orderBy,
  getDocs,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyBExjCanjIquYlS41uATLj8uP5AtBBfKGg",
  authDomain: "icom-4e544.firebaseapp.com",
  projectId: "icom-4e544",
  storageBucket: "icom-4e544.firebasestorage.app",
  messagingSenderId: "857687293653",
  appId: "1:857687293653:web:2deef3b103295f94e0ac5c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// APPLICATION STATE

let currentUser = null;
let currentProfile = null;
let currentConversation = null;
let currentMembers = [];
let usersCache = [];
let conversationUnsubscribe = null;
let messageUnsubscribe = null;
let usersUnsubscribe = null;
let conversationsUnsubscribe = null;


// ELEMENT SHORTCUTS

const $ = id => document.getElementById(id);


// AUTHENTICATION SCREENS

$("showRegister").onclick = () => {
  $("loginForm").classList.add("hidden");
  $("registerForm").classList.remove("hidden");
};

$("showLogin").onclick = () => {
  $("registerForm").classList.add("hidden");
  $("loginForm").classList.remove("hidden");
};


// FRIENDLY ERROR MESSAGES

function friendlyError(error) {
  const errors = {
    "auth/email-already-in-use": "This email already has an account.",
    "auth/invalid-email": "Please enter a valid email address.",
    "auth/weak-password": "Your password must be at least 8 characters.",
    "auth/invalid-credential": "Incorrect email or password.",
    "auth/user-not-found": "No account was found with that email.",
    "auth/wrong-password": "Incorrect password.",
    "auth/too-many-requests": "Too many attempts. Please try again later.",
    "auth/network-request-failed": "Network error. Check your internet connection.",
    "permission-denied": "You do not have permission to do that."
  };

  return errors[error.code] || error.message || "Something went wrong.";
}


// REGISTER

$("registerButton").onclick = async () => {
  const username = $("registerUsername").value.trim();
  const email = $("registerEmail").value.trim().toLowerCase();
  const password = $("registerPassword").value;

  $("registerError").textContent = "";

  if(username.length < 3 || username.length > 24) {
    $("registerError").textContent =
      "Username must be between 3 and 24 characters.";
    return;
  }

  if(password.length < 8) {
    $("registerError").textContent =
      "Password must be at least 8 characters.";
    return;
  }

  if(!/^[a-zA-Z0-9_]+$/.test(username)) {
    $("registerError").textContent =
      "Usernames can only contain letters, numbers, and underscores.";
    return;
  }

  $("registerButton").disabled = true;
  $("registerButton").textContent = "Creating account...";

  try {
    const credential = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    await setDoc(doc(db, "users", credential.user.uid), {
      username,
      usernameLower: username.toLowerCase(),
      email,
      createdAt: serverTimestamp()
    });

  } catch(error) {
    $("registerError").textContent = friendlyError(error);
  } finally {
    $("registerButton").disabled = false;
    $("registerButton").textContent = "Create Account";
  }
};


// LOGIN

$("loginButton").onclick = async () => {
  const email = $("loginEmail").value.trim().toLowerCase();
  const password = $("loginPassword").value;

  $("loginError").textContent = "";

  if(!email || !password) {
    $("loginError").textContent = "Enter your email and password.";
    return;
  }

  $("loginButton").disabled = true;
  $("loginButton").textContent = "Signing in...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch(error) {
    $("loginError").textContent = friendlyError(error);
  } finally {
    $("loginButton").disabled = false;
    $("loginButton").textContent = "Sign In";
  }
};


// PASSWORD RESET

$("forgotPassword").onclick = async () => {
  const email = $("loginEmail").value.trim();

  if(!email) {
    $("loginError").textContent =
      "Enter your email address first.";
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    $("loginError").textContent =
      "Password reset email sent. Check your inbox.";
    $("loginError").style.color = "var(--green)";
  } catch(error) {
    $("loginError").textContent = friendlyError(error);
    $("loginError").style.color = "var(--red)";
  }
};


// SIGN OUT

$("signOutButton").onclick = async () => {
  await signOut(auth);
};


// HELPER FUNCTIONS

function makeAvatar(name) {
  return (name || "?").trim().charAt(0).toUpperCase();
}

function setAvatar(element, name) {
  element.textContent = makeAvatar(name);
}

function showError(message) {
  alert(message);
}

function getOtherMembers(members) {
  return members.filter(uid => uid !== currentUser.uid);
}

function conversationName(data) {
  if(data.isGroup) return data.name || "Group chat";

  const otherUid = getOtherMembers(data.members)[0];
  const other = usersCache.find(user => user.uid === otherUid);

  return other?.username || "Conversation";
}


// AUTHENTICATION STATE

onAuthStateChanged(auth, async user => {

  cleanupListeners();

  currentUser = user;
  currentConversation = null;

  if(!user) {
    currentProfile = null;

    $("authScreen").classList.remove("hidden");
    $("app").classList.add("hidden");
    return;
  }

  try {
    const profileRef = doc(db, "users", user.uid);
    const profileSnapshot = await getDoc(profileRef);

    if(!profileSnapshot.exists()) {
      await signOut(auth);
      $("loginError").textContent =
        "Your profile could not be found. Please contact support.";
      return;
    }

    currentProfile = profileSnapshot.data();

    $("authScreen").classList.add("hidden");
    $("app").classList.remove("hidden");

    $("myUsername").textContent = currentProfile.username;
    $("myEmail").textContent = user.email;
    setAvatar($("myAvatar"), currentProfile.username);

    loadUsers();
    loadConversations();

  } catch(error) {
    console.error(error);
    showError("Could not load your account: " + friendlyError(error));
  }

});


// CLEAN UP REALTIME LISTENERS

function cleanupListeners() {
  if(usersUnsubscribe) usersUnsubscribe();
  if(conversationsUnsubscribe) conversationsUnsubscribe();
  if(messageUnsubscribe) messageUnsubscribe();

  usersUnsubscribe = null;
  conversationsUnsubscribe = null;
  messageUnsubscribe = null;
}


// LOAD USERS

function loadUsers() {

  const usersQuery = collection(db, "users");

  usersUnsubscribe = onSnapshot(usersQuery, snapshot => {

    usersCache = snapshot.docs
      .map(item => ({
        uid: item.id,
        ...item.data()
      }))
      .filter(user => user.uid !== currentUser.uid);

    renderUsers();
    renderConversations();

    if(currentConversation) {
      updateChatHeader();
    }

  }, error => {
    console.error(error);
    $("userList").textContent = "Could not load users.";
  });

}


// DISPLAY USERS

function renderUsers() {

  const container = $("userList");
  const search = $("searchUsers").value.toLowerCase();

  container.replaceChildren();

  const filtered = usersCache.filter(user =>
    (user.username || "").toLowerCase().includes(search)
  );

  if(filtered.length === 0) {
    container.textContent = "No users found.";
    return;
  }

  filtered.forEach(user => {

    const button = document.createElement("button");
    button.className = "list-item";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    setAvatar(avatar, user.username);

    const details = document.createElement("div");
    details.className = "item-details";

    const name = document.createElement("span");
    name.className = "item-name";
    name.textContent = user.username;

    const subtitle = document.createElement("span");
    subtitle.className = "item-subtitle";
    subtitle.textContent = "Start a conversation";

    details.append(name, subtitle);
    button.append(avatar, details);

    button.onclick = () => openDirectMessage(user);

    container.append(button);

  });

}

$("searchUsers").addEventListener("input", renderUsers);


// OPEN OR CREATE PRIVATE CONVERSATION

async function openDirectMessage(otherUser) {

  const members = [currentUser.uid, otherUser.uid].sort();
  const conversationId = members.join("_");

  try {

    const conversationRef = doc(db, "conversations", conversationId);
    const existing = await getDoc(conversationRef);

    if(!existing.exists()) {

      await setDoc(conversationRef, {
        members,
        isGroup: false,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
        lastMessage: "",
        lastSenderId: ""
      });

    }

    await openConversation(conversationId);

  } catch(error) {
    console.error(error);
    showError("Could not open conversation: " + friendlyError(error));
  }

}


// CREATE GROUP CHAT

async function createGroup() {

  const name = prompt("Enter a name for your group:");

  if(!name || !name.trim()) return;

  const names = prompt(
    "Enter the usernames of the people you want to add, separated by commas:"
  );

  if(!names) return;

  const requestedNames = names
    .split(",")
    .map(name => name.trim().toLowerCase())
    .filter(Boolean);

  const selectedUsers = usersCache.filter(user =>
    requestedNames.includes((user.username || "").toLowerCase())
  );

  const members = [
    currentUser.uid,
    ...selectedUsers.map(user => user.uid)
  ];

  if(members.length < 2) {
    showError("Add at least one other registered user.");
    return;
  }

  if(members.length > 20) {
    showError("Groups are limited to 20 members.");
    return;
  }

  try {

    const conversationRef = doc(collection(db, "conversations"));

    await setDoc(conversationRef, {
      name: name.trim().slice(0, 50),
      members,
      isGroup: true,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
      lastMessage: "",
      lastSenderId: ""
    });

    await openConversation(conversationRef.id);

  } catch(error) {
    console.error(error);
    showError("Could not create group: " + friendlyError(error));
  }

}


// GROUP BUTTON

const groupButton = document.createElement("button");
groupButton.className = "secondary-btn";
groupButton.textContent = "+ New Group";
groupButton.style.width = "100%";
groupButton.style.marginTop = "12px";
groupButton.onclick = createGroup;

$("conversationList").parentElement.append(groupButton);


// LOAD CONVERSATIONS

function loadConversations() {

  const conversationsQuery = query(
    collection(db, "conversations"),
    where("members", "array-contains", currentUser.uid)
  );

  conversationsUnsubscribe = onSnapshot(
    conversationsQuery,
    snapshot => {

      const conversations = snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
      }));

      conversations.sort((a, b) => {
        const timeA = a.updatedAt?.toMillis?.() || 0;
        const timeB = b.updatedAt?.toMillis?.() || 0;
        return timeB - timeA;
      });

      window.currentConversationList = conversations;

      renderConversations();

    },
    error => {
      console.error(error);
      $("conversationList").textContent =
        "Could not load conversations.";
    }
  );

}


// DISPLAY CONVERSATIONS

function renderConversations() {

  const container = $("conversationList");
  container.replaceChildren();

  const conversations = window.currentConversationList || [];

  if(conversations.length === 0) {
    const empty = document.createElement("div");
    empty.style.cssText = "padding:12px;color:var(--muted);font-size:13px";
    empty.textContent = "No conversations yet.";
    container.append(empty);
    return;
  }

  conversations.forEach(conversation => {

    const button = document.createElement("button");
    button.className = "list-item";

    if(currentConversation?.id === conversation.id) {
      button.classList.add("active");
    }

    const name = conversationName(conversation);

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    setAvatar(avatar, name);

    const details = document.createElement("div");
    details.className = "item-details";

    const title = document.createElement("span");
    title.className = "item-name";
    title.textContent = name;

    const subtitle = document.createElement("span");
    subtitle.className = "item-subtitle";
    subtitle.textContent = conversation.lastMessage || "No messages yet";

    details.append(title, subtitle);
    button.append(avatar, details);

    button.onclick = () => openConversation(conversation.id);

    container.append(button);

  });

}


// OPEN A CONVERSATION

async function openConversation(conversationId) {

  try {

    const ref = doc(db, "conversations", conversationId);
    const snapshot = await getDoc(ref);

    if(!snapshot.exists()) {
      showError("This conversation no longer exists.");
      return;
    }

    const data = snapshot.data();

    if(!data.members.includes(currentUser.uid)) {
      showError("You are not a member of this conversation.");
      return;
    }

    currentConversation = {
      id: conversationId,
      ...data
    };

    currentMembers = data.members;

    $("welcomeScreen").classList.add("hidden");
    $("chatScreen").classList.remove("hidden");
    $("app").classList.add("show-chat");

    updateChatHeader();

    if(messageUnsubscribe) messageUnsubscribe();

    const messagesQuery = query(
      collection(db, "conversations", conversationId, "messages"),
      orderBy("createdAt", "asc")
    );

    messageUnsubscribe = onSnapshot(
      messagesQuery,
      snapshot => {
        renderMessages(snapshot.docs.map(item => ({
          id: item.id,
          ...item.data()
        })));
      },
      error => {
        console.error(error);
        $("messages").textContent =
          "Could not load messages: " + friendlyError(error);
      }
    );

    renderConversations();

  } catch(error) {
    console.error(error);
    showError("Could not open chat: " + friendlyError(error));
  }

}


// UPDATE CHAT HEADER

function updateChatHeader() {

  if(!currentConversation) return;

  const name = conversationName(currentConversation);

  $("chatTitle").textContent = name;

  setAvatar($("chatAvatar"), name);

  if(currentConversation.isGroup) {
    $("chatSubtitle").textContent =
      currentMembers.length + " members";
  } else {
    const otherUid = getOtherMembers(currentMembers)[0];
    const other = usersCache.find(user => user.uid === otherUid);

    $("chatSubtitle").textContent =
      other?.email || "Private conversation";
  }

}


// DISPLAY MESSAGES

function renderMessages(messages) {

  const container = $("messages");
  container.replaceChildren();

  if(messages.length === 0) {
    const empty = document.createElement("div");
    empty.className = "chat-empty";
    empty.textContent = "No messages yet. Start the conversation!";
    container.append(empty);
    return;
  }

  messages.forEach(message => {

    const wrapper = document.createElement("div");

    wrapper.className = "message" +
      (message.senderId === currentUser.uid ? " mine" : "");

    const author = document.createElement("span");
    author.className = "message-author";

    const sender = usersCache.find(
      user => user.uid === message.senderId
    );

    author.textContent =
      message.senderId === currentUser.uid
        ? "You"
        : sender?.username || "Unknown user";

    const bubble = document.createElement("div");
    bubble.className = "message-bubble";
    bubble.textContent = message.text;

    const time = document.createElement("span");
    time.className = "message-time";

    const timestamp = message.createdAt?.toDate?.();

    time.textContent = timestamp
      ? timestamp.toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit"
        })
      : "Sending...";

    wrapper.append(author, bubble, time);
    container.append(wrapper);

  });

  container.scrollTop = container.scrollHeight;

}


// SEND MESSAGE

$("messageForm").onsubmit = async event => {

  event.preventDefault();

  const text = $("messageInput").value.trim();

  if(!text || !currentConversation) return;

  const conversationId = currentConversation.id;

  $("messageInput").value = "";
  $("messageInput").disabled = true;

  try {

    const conversationRef = doc(
      db,
      "conversations",
      conversationId
    );

    const conversationSnapshot = await getDoc(conversationRef);

    if(!conversationSnapshot.exists() ||
       !conversationSnapshot.data().members.includes(currentUser.uid)) {
      throw new Error("You are no longer a member of this conversation.");
    }

    await addDoc(
      collection(
        db,
        "conversations",
        conversationId,
        "messages"
      ),
      {
        text: text.slice(0, 2000),
        senderId: currentUser.uid,
        createdAt: serverTimestamp()
      }
    );

    await updateDoc(conversationRef, {
      lastMessage: text.slice(0, 100),
      lastSenderId: currentUser.uid,
      updatedAt: serverTimestamp()
    });

  } catch(error) {

    console.error(error);
    showError("Message could not be sent: " + friendlyError(error));

    $("messageInput").value = text;

  } finally {
    $("messageInput").disabled = false;
    $("messageInput").focus();
  }

};


// MOBILE BACK BUTTON

$("mobileBack").onclick = () => {
  $("app").classList.remove("show-chat");
};


// INITIALIZE CONVERSATION LIST

window.currentConversationList = [];

</script>

</body>
</html>
